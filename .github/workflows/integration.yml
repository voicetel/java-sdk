name: integration

on:
  schedule:
    - cron: "0 6 * * 1"  # weekly Monday 06:00 UTC — within the 6/hr/IP budget
  workflow_dispatch:

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Integration-style tests (in-process)
        run: mvn -B -DskipTests=false test
